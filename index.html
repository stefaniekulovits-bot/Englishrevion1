<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f72ff"><title>Lottes Vokabel-Abenteuer – Unit 2</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#edf3ff,#fff,#f0faf6);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#20283a}.app{max-width:700px;margin:auto;padding:12px}.top,.stats,.prog{display:flex;gap:8px}.top{justify-content:space-between;align-items:center;margin-bottom:10px}.brand{font-weight:900;font-size:19px}.brand i{color:#4f72ff;font-style:normal}.stat{flex:1;background:#fff;border:1px solid #e5eaf2;border-radius:15px;padding:8px;text-align:center;box-shadow:0 5px 18px #1e31520b}.lab{font-size:10px;color:#748096;font-weight:800;text-transform:uppercase}.val{font-weight:900;font-size:16px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:24px;padding:20px;margin-top:12px;box-shadow:0 12px 30px #1e315214}.prog{justify-content:space-between;color:#748096;font-size:12px;font-weight:800}.bar{height:9px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;width:0;background:#4f72ff;transition:.3s}.badge{display:inline-block;padding:7px 10px;border-radius:99px;background:#edf3ff;color:#315dcc;font-size:12px;font-weight:900}.q{text-align:center;font-size:27px;font-weight:950;margin:22px 0 7px}.sub{text-align:center;color:#748096;font-size:13px;margin-bottom:15px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn,.opt{border:0;border-radius:16px;padding:14px;background:#f3f6fb;font-weight:850;font-size:16px;cursor:pointer}.opt{min-height:60px}.opt.good{background:#e4f8ef}.opt.bad{background:#ffe9e9}.input{width:100%;padding:15px;border:2px solid #dfe6f1;border-radius:16px;font-size:19px;font-weight:700;outline:0}.primary{width:100%;margin-top:9px;background:#4f72ff;color:#fff}.feedback{min-height:48px;margin-top:12px;padding:11px;border-radius:14px;font-size:14px;display:none}.feedback.show{display:block}.goodbox{background:#eafaf3;color:#08774e}.badbox{background:#fff0f0;color:#a82e2e}.next{display:none;width:100%;margin-top:9px;background:#20283a;color:#fff}.next.show{display:block}.shake{animation:s .3s}@keyframes s{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}@media(max-width:520px){.stats .stat{padding:7px 3px}.val{font-size:14px}.lab{font-size:9px}.opts{grid-template-columns:1fr}.q{font-size:24px}}</style></head><body><main class="app"><div class="top"><div class="brand">Lottes <i>Vokabel-Abenteuer</i></div><b id="level">Level 1</b></div><div class="stats"><div class="stat"><div class="lab">Herzen</div><div class="val" id="hearts">❤️❤️❤️</div></div><div class="stat"><div class="lab">XP</div><div class="val" id="xp">0</div></div><div class="stat"><div class="lab">Streak</div><div class="val" id="streak">0</div></div><div class="stat"><div class="lab">Fortschritt</div><div class="val" id="count">0/10</div></div></div><div class="card"><div class="prog"><span id="mode">Level 1 · Grundlagen</span><span id="round">Frage 1/10</span></div><div class="bar"><div class="fill" id="fill"></div></div></div><div class="card" id="game"></div></main><script>
const V=[['tree','Baum'],['monkey','Affe'],['parrot','Papagei'],['giraffe','Giraffe'],['train','Zug'],['penguin','Pinguin'],['guide','Reiseführer/in'],['lion','Löwe'],['next to','neben'],['in','in'],['behind','hinter'],['under','unter'],['on','auf'],['in front of','vor'],['zoo','Zoo'],['beautiful','schön / hübsch'],['big','groß'],['now','jetzt'],["there is (there's)",'es gibt / da ist'],['there are','es gibt / da sind'],['What is it?','Was ist los?'],['where','wo'],['small','klein'],['adult','Erwachsene/r'],['at','bei; an; hier: in'],['to bring','(mit-)bringen'],['but','aber'],['to feed','füttern'],['to run around','herumlaufen'],['to','zu; bis; vor; hier: in'],['welcome','willkommen'],['from','aus'],['year','Jahr; Jahrgangsstufe'],['he','er'],['she','sie'],['to talk','sprechen; sich unterhalten'],['they','sie'],['we','wir'],['for','für'],['happy','glücklich; fröhlich; zufrieden'],['to let somebody out','jemanden herauslassen'],['us','uns'],['car','Auto'],['At last','Endlich'],['How strange!','Wie komisch!'],['Let me see.','Lass mich mal schauen.'],['stone','Stein']];
const $=x=>document.getElementById(x);let S={h:3,xp:0,st:0,q:0,wrong:[],boss:false,bi:0,bw:[]},cur=null,answered=false;
function sh(a){return a.slice().sort(()=>Math.random()-.5)}function norm(x){return x.trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}function render(){if(S.h<=0)return over();$('hearts').textContent='❤️'.repeat(S.h)+'🖤'.repeat(3-S.h);$('xp').textContent=S.xp;$('streak').textContent=S.st;$('count').textContent=(S.boss?'BOSS ':S.q)+'/10';$('level').textContent='Level '+(S.q<4?1:S.q<8?2:3);$('mode').textContent=S.boss?'Boss-Runde · Englisch schreiben':`Level ${S.q<4?1:S.q<8?2:3} · ${S.q<4?'Grundlagen':S.q<8?'gemischt':'schwierige Wörter'}`;$('round').textContent=S.boss?`Boss ${S.bi+1}/3`:`Frage ${S.q+1}/10`;$('fill').style.width=(S.boss?100:S.q*10)+'%';ask()}
function pick(){let pool=V.filter(x=>!S.wrong.includes(x[0]));if(S.q>=7&&S.wrong.length)pool=V.filter(x=>S.wrong.includes(x[0]));return sh(pool.length?pool:V)[0]}
function ask(){answered=false;cur=pick();let type=S.boss||Math.random()<.7?'write':Math.random()<.5?'mc':'de';let html=`<span class="badge">${type==='write'?'✍️ ENGLISCH SCHREIBEN':type==='mc'?'🎯 MULTIPLE CHOICE':'🇬🇧 → 🇩🇪'}</span>`;if(type==='write'){html+=`<div class="q">${cur[1]}</div><div class="sub">Schreibe die englische Vokabel selbst.</div><input class="input" id="in" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Englisches Wort / Phrase"><button class="btn primary" id="check">Prüfen</button>`}else if(type==='de'){html+=`<div class="q">${cur[0]}</div><div class="sub">Was bedeutet das?</div><div class="opts" id="opts"></div>`}else{html+=`<div class="q">${cur[1]}</div><div class="sub">Welche englische Vokabel passt?</div><div class="opts" id="opts"></div>`}html+=`<div id="fb" class="feedback"></div><button class="btn next" id="next">Weiter →</button>`;$('game').innerHTML=html;if(type==='write'){let i=$('in');$('check').onclick=()=>check(i.value,type);i.onkeydown=e=>{if(e.key==='Enter')check(i.value,type)};setTimeout(()=>i.focus(),50)}else{$('opts').innerHTML=type==='de'?sh([cur[1],...sh(V.filter(x=>x[0]!==cur[0])).slice(0,3).map(x=>x[1])]).map(x=>`<button class="opt">${x}</button>`).join(''):sh([cur[0],...sh(V.filter(x=>x[0]!==cur[0])).slice(0,3).map(x=>x[0])]).map(x=>`<button class="opt">${x}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>check(b.textContent,type))}}
function check(ans,type){if(answered)return;answered=true;let ok=type==='write'?norm(ans)===norm(cur[0]):type==='de'?ans===cur[1]:ans===cur[0];if(ok){S.xp+=10;S.st++;let bonus=S.st%3===0;if(bonus)S.xp+=10;fb(true,`Richtig! <b>${cur[0]}</b> = <b>${cur[1]}</b>${bonus?' · 🔥 +10 Streak-Bonus!':''}`)}else{S.h--;S.st=0;if(!S.wrong.includes(cur[0]))S.wrong.push(cur[0]);fb(false,`Die richtige Lösung ist <b>${cur[0]}</b>.<br>🧠 Merkhilfe: <b>${hint(cur)}</b>`);$('game').classList.add('shake');setTimeout(()=>$('game').classList.remove('shake'),300)}renderStats();$('next').classList.add('show');$('next').textContent=S.h<=0?'Ergebnis ansehen →':'Weiter →';$('next').onclick=next}
function fb(g,t){let f=$('fb');f.className='feedback show '+(g?'goodbox':'badbox');f.innerHTML=t}function renderStats(){$('hearts').textContent='❤️'.repeat(S.h)+'🖤'.repeat(3-S.h);$('xp').textContent=S.xp;$('streak').textContent=S.st;$('count').textContent=(S.boss?'BOSS ':S.q)+'/10'}function hint(w){let m={'beautiful':'beautiful klingt wie Beauty – schön.','behind':'behind = hinter.','in front of':'front ist vorne → vor.','next to':'next to = direkt neben.','under':'under = unter.','to bring':'bring = bringen.','to feed':'feed = füttern.','to run around':'run = laufen → herumlaufen.','welcome':'welcome = willkommen.','happy':'happy = glücklich.','car':'car = Auto.','stone':'stone = Stein.'};return m[w[0]]||`${w[0]} = ${w[1]}`}
function next(){if(S.h<=0)return over();if(S.boss){S.bi++;if(S.bi>=3)return win();return render()}S.q++;if(S.q>=10)return startBoss();render()}
function startBoss(){S.boss=true;S.bi=0;S.bw=sh(S.wrong.map(id=>V.find(x=>x[0]===id)).filter(Boolean));if(S.bw.length<3)S.bw=sh(V).slice(0,3);pick=()=>S.bw[S.bi];$('mode').textContent='Boss-Runde · 3 Wörter schreiben';render()}
function win(){S.xp+=50;$('game').innerHTML='<div style="text-align:center"><div style="font-size:58px">🏆</div><span class="badge">ABZEICHEN FREIGESCHALTET</span><h2>Boss besiegt!</h2><p>Alle 3 Wörter richtig geschrieben.</p><p><b>+50 XP</b> · Gesamt: <b>'+S.xp+' XP</b></p><button class="btn primary" onclick="location.reload()">Nochmal spielen</button></div>';renderStats()}
function over(){ $('game').innerHTML='<div style="text-align:center"><div style="font-size:55px">💪</div><span class="badge">RUNDE BEENDET</span><h2>Fast geschafft!</h2><p>Du hast <b>'+S.xp+' XP</b> gesammelt.</p><p>Die schwierigen Wörter werden beim nächsten Spiel wieder bevorzugt.</p><button class="btn primary" onclick="location.reload()">Nochmal spielen</button></div>';renderStats()}
render();
</script></body></html>
