<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f72ff"><title>Lottes Vokabel-Abenteuer – Unit 2</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#edf3ff,#fff,#f0faf6);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#20283a}.app{max-width:700px;margin:auto;padding:12px}.top,.stats,.prog{display:flex;gap:8px}.top{justify-content:space-between;align-items:center;margin-bottom:10px}.brand{font-weight:900;font-size:19px}.brand i{color:#4f72ff;font-style:normal}.stat{flex:1;background:#fff;border:1px solid #e5eaf2;border-radius:15px;padding:8px;text-align:center;box-shadow:0 5px 18px #1e31520b}.lab{font-size:10px;color:#748096;font-weight:800;text-transform:uppercase}.val{font-weight:900;font-size:16px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:24px;padding:20px;margin-top:12px;box-shadow:0 12px 30px #1e315214}.prog{justify-content:space-between;color:#748096;font-size:12px;font-weight:800}.bar{height:9px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;width:0;background:#4f72ff;transition:.3s}.badge{display:inline-block;padding:7px 10px;border-radius:99px;background:#edf3ff;color:#315dcc;font-size:12px;font-weight:900}.q{text-align:center;font-size:27px;font-weight:950;margin:22px 0 7px}.sub{text-align:center;color:#748096;font-size:13px;margin-bottom:15px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn,.opt{border:0;border-radius:16px;padding:14px;background:#f3f6fb;font-weight:850;font-size:16px;cursor:pointer}.opt{min-height:60px}.opt.good{background:#e4f8ef}.opt.bad{background:#ffe9e9}.input{width:100%;padding:15px;border:2px solid #dfe6f1;border-radius:16px;font-size:19px;font-weight:700;outline:0}.primary{width:100%;margin-top:9px;background:#4f72ff;color:#fff}.feedback{min-height:48px;margin-top:12px;padding:11px;border-radius:14px;font-size:14px;display:none}.feedback.show{display:block}.goodbox{background:#eafaf3;color:#08774e}.badbox{background:#fff0f0;color:#a82e2e}.next{display:none;width:100%;margin-top:9px;background:#20283a;color:#fff}.next.show{display:block}.shake{animation:s .3s}@keyframes s{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}.note{background:#f5f7fc;border-radius:14px;padding:11px;margin-top:12px;font-size:13px}.reset{background:transparent;border:0;color:#7b8496;font-size:12px;text-decoration:underline;margin-top:15px;cursor:pointer}@media(max-width:520px){.stats .stat{padding:7px 3px}.val{font-size:14px}.lab{font-size:9px}.opts{grid-template-columns:1fr}.q{font-size:24px}}</style></head><body><main class="app"><div class="top"><div class="brand">Lottes <i>Vokabel-Abenteuer</i></div><b id="level">Level 1</b></div><div class="stats"><div class="stat"><div class="lab">Herzen</div><div class="val" id="hearts">❤️❤️❤️</div></div><div class="stat"><div class="lab">XP</div><div class="val" id="xp">0</div></div><div class="stat"><div class="lab">Streak</div><div class="val" id="streak">0</div></div><div class="stat"><div class="lab">Gelernt</div><div class="val" id="known">0/47</div></div></div><div class="card"><div class="prog"><span id="mode">Vokabeln entdecken</span><span id="round">Frage 1</span></div><div class="bar"><div class="fill" id="fill"></div></div></div><div class="card" id="game"></div></main><script>
const V=[['tree','Baum'],['monkey','Affe'],['parrot','Papagei'],['giraffe','Giraffe'],['train','Zug'],['penguin','Pinguin'],['guide','Reiseführer/in'],['lion','Löwe'],['next to','neben'],['in','in'],['behind','hinter'],['under','unter'],['on','auf'],['in front of','vor'],['zoo','Zoo'],['beautiful','schön / hübsch'],['big','groß'],['now','jetzt'],["there is (there's)",'es gibt / da ist'],['there are','es gibt / da sind'],['What is it?','Was ist los?'],['where','wo'],['small','klein'],['adult','Erwachsene/r'],['at','bei; an; hier: in'],['to bring','(mit-)bringen'],['but','aber'],['to feed','füttern'],['to run around','herumlaufen'],['to','zu; bis; vor; hier: in'],['welcome','willkommen'],['from','aus'],['year','Jahr; Jahrgangsstufe'],['he','er'],['she','sie'],['to talk','sprechen; sich unterhalten'],['they','sie'],['we','wir'],['for','für'],['happy','glücklich; fröhlich; zufrieden'],['to let somebody out','jemanden herauslassen'],['us','uns'],['car','Auto'],['At last','Endlich'],['How strange!','Wie komisch!'],['Let me see.','Lass mich mal schauen.'],['stone','Stein']];
const KEY='lotteUnit2ProgressV2';
let P={known:[],hard:[],xp:0,streak:0,hearts:3,total:0};try{P=Object.assign(P,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){};
const $=x=>document.getElementById(x);let cur=null,answered=false,mode='select';
function save(){localStorage.setItem(KEY,JSON.stringify(P))}function sh(a){return a.slice().sort(()=>Math.random()-.5)}function norm(x){return x.trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}
function stats(){P.known=[...new Set(P.known)];P.hard=[...new Set(P.hard)];$('hearts').textContent='❤️'.repeat(P.hearts)+'🖤'.repeat(3-P.hearts);$('xp').textContent=P.xp;$('streak').textContent=P.streak;$('known').textContent=P.known.length+'/'+V.length;$('fill').style.width=(P.known.length/V.length*100)+'%';$('level').textContent=P.known.length<10?'Level 1':P.known.length<30?'Level 2':'Level 3'}
function choose(){let unknown=V.filter(v=>!P.known.includes(v[0]));let known=V.filter(v=>P.known.includes(v[0]));let hard=V.filter(v=>P.hard.includes(v[0]));
 // Zuerst werden unbekannte Wörter ausgewählt. Sobald ein Wort einmal richtig ausgewählt wurde,
 // verschwindet es aus der Auswahlphase und kommt nur noch als Schreibaufgabe.
 if(unknown.length){mode='select';cur=sh(unknown)[0];}
 else{mode='write';let pool=hard.length?hard:known;cur=sh(pool.length?pool:V)[0];}
 renderQuestion();}
function renderQuestion(){answered=false;let html=`<span class="badge">${mode==='select'?'🎯 1. VOKABEL KENNENLERNEN':'✍️ 2. ENGLISCH SCHREIBEN'}</span>`;
 if(mode==='select'){html+=`<div class="q">${cur[1]}</div><div class="sub">Welche englische Vokabel gehört dazu?</div><div class="opts" id="opts"></div><div class="note">💡 <b>So funktioniert das Spiel:</b> Erst musst du die Vokabel erkennen. Wenn du sie kannst, kommt sie danach nur noch zum <b>Englisch-Schreiben</b>.</div>`;}
 else{html+=`<div class="q">${cur[1]}</div><div class="sub">Schreibe die englische Vokabel selbst. Deutsch musst du nie schreiben.</div><input class="input" id="in" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Englisches Wort / Phrase"><button class="btn primary" id="check">Prüfen</button>`;}
 html+=`<div id="fb" class="feedback"></div><button class="btn next" id="next">Weiter →</button>`;$('game').innerHTML=html;
 if(mode==='select'){let opts=sh([cur[0],...sh(V.filter(v=>v[0]!==cur[0])).slice(0,3).map(v=>v[0])]);$('opts').innerHTML=opts.map(x=>`<button class="opt">${x}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.textContent));}
 else{let i=$('in');$('check').onclick=()=>answer(i.value);i.onkeydown=e=>{if(e.key==='Enter')answer(i.value)};setTimeout(()=>i.focus(),70)}}
function answer(ans){if(answered)return;answered=true;let ok=mode==='select'?ans===cur[0]:norm(ans)===norm(cur[0]);if(ok){P.xp+=10;P.streak++;if(P.streak%3===0)P.xp+=10;if(mode==='select'){P.known.push(cur[0]);P.hard=P.hard.filter(x=>x!==cur[0]);feedback(true,`Richtig! <b>${cur[0]}</b> sitzt. 🎉<br><small>Ab jetzt wird dieses Wort nur noch auf Englisch abgefragt.</small>`)}else{P.hard=P.hard.filter(x=>x!==cur[0]);feedback(true,`Richtig geschrieben! <b>${cur[0]}</b> ✓`+(P.streak%3===0?'<br>🔥 +10 Streak-Bonus!':''))}}
 else{P.hearts--;P.streak=0;if(!P.hard.includes(cur[0]))P.hard.push(cur[0]);feedback(false,`Noch nicht. Die richtige Lösung ist <b>${cur[0]}</b>.<br>🧠 ${hint(cur)}`);$('game').classList.add('shake');setTimeout(()=>$('game').classList.remove('shake'),300)}save();stats();$('next').classList.add('show');$('next').textContent=P.hearts<=0?'Ergebnis ansehen →':'Weiter →';$('next').onclick=next}
function feedback(ok,text){let f=$('fb');f.className='feedback show '+(ok?'goodbox':'badbox');f.innerHTML=text}
function hint(v){const h={'beautiful':'beautiful klingt wie Beauty – schön.','behind':'behind = hinter.','in front of':'front ist vorne → vor.','next to':'next to = direkt neben.','under':'under = unter.','to bring':'bring = bringen.','to feed':'feed = füttern.','to run around':'run = laufen → herumlaufen.','welcome':'welcome = willkommen.','happy':'happy = glücklich.','car':'car = Auto.','stone':'stone = Stein.','parrot':'parrot = Papagei.','giraffe':'giraffe = Giraffe.'};return h[v[0]]||`${v[0]} = ${v[1]}.`}
function next(){if(P.hearts<=0)return end();choose()}
function end(){let done=P.known.length===V.length;$('game').innerHTML=`<div style="text-align:center"><div style="font-size:58px">${done?'🏆':'💪'}</div><span class="badge">${done?'ALLE VOKABELN GELERNT':'RUNDE BEENDET'}</span><h2>${done?'Fantastisch, Lotte!':'Fast geschafft!'}</h2><p>${done?'Alle Vokabeln wurden zuerst erkannt und danach beim Schreiben geübt.':'Du hast '+P.known.length+' von '+V.length+' Vokabeln freigeschaltet.'}</p><p><b>${P.xp} XP</b> gesammelt.</p><button class="btn primary" onclick="location.reload()">Weiter üben</button><button class="reset" onclick="localStorage.removeItem(KEY);location.reload()">Lernfortschritt zurücksetzen</button></div>`}
stats();choose();
</script></body></html>
