<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6c4cff"><title>Lottes Anime Vokabel-Quest</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(150deg,#eef1ff,#fff7fd 55%,#eafff6);color:#20243a}.app{max-width:720px;margin:auto;padding:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-size:20px;font-weight:950}.brand span{color:#684cff}.hero{margin-top:10px;background:linear-gradient(135deg,#6c4cff,#9c63ff);color:#fff;border-radius:25px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 28px #684cff33}.avatar{width:58px;height:58px;border-radius:50%;background:#fff;position:relative;flex:none;box-shadow:0 5px 15px #0002}.avatar:before{content:"";position:absolute;width:18px;height:13px;background:#20243a;border-radius:50% 50% 40% 40%;left:11px;top:20px;box-shadow:20px 0 #20243a}.avatar:after{content:"✦";position:absolute;color:#ffcf4a;font-size:23px;right:-4px;top:-8px}.hero b{font-size:15px}.hero small{display:block;opacity:.9;margin-top:2px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.stat,.card{background:#fff;border:1px solid #e5e8f1;border-radius:20px;box-shadow:0 8px 24px #26305212}.stat{padding:8px 4px;text-align:center}.lab{font-size:9px;color:#7d8498;font-weight:900;text-transform:uppercase}.val{font-size:15px;font-weight:950}.actions{display:flex;gap:8px;margin-top:10px}.action{flex:1;border:0;border-radius:14px;padding:11px;background:#fff;font-weight:900;color:#4f3dcc;box-shadow:0 5px 18px #26305212}.card{padding:16px;margin-top:10px}.prog{display:flex;justify-content:space-between;color:#727b91;font-size:12px;font-weight:900}.bar{height:9px;background:#edf0f6;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;background:linear-gradient(90deg,#684cff,#ff6eb4);transition:.35s}.badge{display:inline-block;background:#eeeaff;color:#5038c7;padding:7px 10px;border-radius:99px;font-size:11px;font-weight:950}.q{text-align:center;font-size:29px;font-weight:950;margin:18px 0 5px}.sub{text-align:center;color:#737c90;font-size:13px;margin-bottom:13px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.opt,.btn{border:0;border-radius:16px;padding:14px;font-size:16px;font-weight:900}.opt{background:#f4f5fa;min-height:58px}.input{width:100%;padding:15px;border:2px solid #dfe3ee;border-radius:16px;font-size:19px;font-weight:750;outline:none}.primary{width:100%;margin-top:8px;background:#684cff;color:#fff}.feedback{display:none;margin-top:10px;padding:11px;border-radius:14px;font-size:14px}.feedback.show{display:block}.goodbox{background:#e8fbf2;color:#08774e}.badbox{background:#fff0f1;color:#a52e3a}.next{display:none;width:100%;margin-top:8px;background:#24283a;color:#fff}.next.show{display:block}.note{margin-top:11px;padding:11px;background:#f5f6fb;border-radius:14px;font-size:12px}.modal{display:none;position:fixed;inset:0;background:#1d214a88;z-index:5;padding:12px;overflow:auto}.modal.open{display:block}.sheet{max-width:720px;margin:15px auto;background:#fff;border-radius:25px;padding:16px}.sheethead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#f0f1f6;border-radius:50%;width:38px;height:38px;font-size:20px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.pill{padding:9px;border-radius:14px;text-align:center;background:#f4f5fa;font-weight:900;font-size:12px}.word{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid #edf0f5;gap:8px}.word b{display:block}.word small{color:#7a8193}.level{font-size:11px;font-weight:950;padding:6px 8px;border-radius:99px;white-space:nowrap}.new{background:#eef0f5;color:#667}.practice{background:#eeeaff;color:#553dcc}.good{background:#e5faef;color:#08774e}.great{background:#fff0bf;color:#805d00}.boss{background:linear-gradient(135deg,#241a5c,#7b42b8);color:#fff;text-align:center;padding:20px;border-radius:22px}.confetti{font-size:32px;letter-spacing:4px}@media(max-width:520px){.stats{gap:5px}.val{font-size:13px}.opts{grid-template-columns:1fr}.q{font-size:25px}}</style></head><body><main class="app"><div class="top"><div class="brand">Lottes <span>Anime-Vokabel-Quest</span></div><b id="level">Level 1</b></div><div class="hero"><div class="avatar"></div><div><b>Bereit für deine nächste Quest?</b><small>Erkennen → schreiben → meistern!</small></div></div><div class="stats"><div class="stat"><div class="lab">Herzen</div><div class="val" id="hearts"></div></div><div class="stat"><div class="lab">XP</div><div class="val" id="xp">0</div></div><div class="stat"><div class="lab">Streak</div><div class="val" id="streak">0</div></div><div class="stat"><div class="lab">Meister</div><div class="val" id="known">0/47</div></div></div><div class="actions"><button class="action" id="overview">📚 Meine Vokabeln</button><button class="action" id="resetBtn">↻ Neustart</button></div><div class="card"><div class="prog"><span id="mode">Vokabeln entdecken</span><span id="round">Frage 1</span></div><div class="bar"><div class="fill" id="fill"></div></div></div><div class="card" id="game"></div></main><div class="modal" id="modal"><div class="sheet"><div class="sheethead"><div><h2 style="margin:0">📚 Meine Vokabeln</h2><small>Dein Lernstand</small></div><button class="close" id="close">×</button></div><div class="summary" id="summary"></div><div id="words"></div></div></div><script>const V=[['tree','Baum'],['monkey','Affe'],['parrot','Papagei'],['giraffe','Giraffe'],['train','Zug'],['penguin','Pinguin'],['guide','Reiseführer/in'],['lion','Löwe'],['next to','neben'],['in','in'],['behind','hinter'],['under','unter'],['on','auf'],['in front of','vor'],['zoo','Zoo'],['beautiful','schön / hübsch'],['big','groß'],['now','jetzt'],["there is (there's)",'es gibt / da ist'],['there are','es gibt / da sind'],['What is it?','Was ist los?'],['where','wo'],['small','klein'],['adult','Erwachsene/r'],['at','bei; an; hier: in'],['to bring','(mit-)bringen'],['but','aber'],['to feed','füttern'],['to run around','herumlaufen'],['to','zu; bis; vor; hier: in'],['welcome','willkommen'],['from','aus'],['year','Jahr; Jahrgangsstufe'],['he','er'],['she','sie'],['to talk','sprechen; sich unterhalten'],['they','sie'],['we','wir'],['for','für'],['happy','glücklich; fröhlich; zufrieden'],['to let somebody out','jemanden herauslassen'],['us','uns'],['car','Auto'],['At last','Endlich'],['How strange!','Wie komisch!'],['Let me see.','Lass mich mal schauen.'],['stone','Stein']];const KEY='lotteUnit2ProgressV3';let P={xp:0,streak:0,hearts:3,questions:0,bosses:0,words:{}};try{P=Object.assign(P,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){}if(!Object.keys(P.words||{}).length){try{let old=JSON.parse(localStorage.getItem('lotteUnit2ProgressV2')||'null');if(old){P.xp=old.xp||0;(old.known||[]).forEach(k=>P.words[k]={stage:1,writes:0,wrong:0});(old.hard||[]).forEach(k=>P.words[k]={stage:1,writes:0,wrong:1});}}catch(e){}}P.words=P.words||{};V.forEach(v=>{if(!P.words[v[0]])P.words[v[0]]={stage:0,writes:0,wrong:0}});const $=x=>document.getElementById(x);function save(){localStorage.setItem(KEY,JSON.stringify(P))}function sh(a){return a.slice().sort(()=>Math.random()-.5)}function norm(x){return x.trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}function stage(v){return P.words[v[0]].stage}function label(s){return s===0?['NEU','new']:s===1?['NOCH ÜBEN','practice']:s===2?['GUT','good']:['SEHR GUT','great']}function mastered(){return V.filter(v=>stage(v)>=2).length}function stats(){$('hearts').textContent='❤️'.repeat(P.hearts)+'🖤'.repeat(3-P.hearts);$('xp').textContent=P.xp;$('streak').textContent=P.streak;$('known').textContent=mastered()+'/'+V.length;$('fill').style.width=(mastered()/V.length*100)+'%';$('level').textContent=mastered()<10?'Level 1':mastered()<30?'Level 2':'Level 3'}let cur=null,mode='select',answered=false,bossPool=[],bossIndex=0;function pick(){let n=V.filter(v=>stage(v)===0),p=V.filter(v=>stage(v)===1),g=V.filter(v=>stage(v)===2),s=V.filter(v=>stage(v)>=3);if(P.questions>0&&P.questions%10===0){boss();return}if(n.length){mode='select';cur=sh(n)[0]}else{mode='write';let pool=sh(p.concat(p,g,g,s,V.filter(v=>P.words[v[0]].wrong>0)));cur=pool[0]||sh(V)[0]}render()}function render(){answered=false;$('mode').textContent=mode==='select'?'Vokabeln entdecken':'Englisch schreiben';$('round').textContent='Frage '+(P.questions+1);let h=`<span class="badge">${mode==='select'?'🎯 1. KENNENLERNEN':'✍️ 2. ENGLISCH SCHREIBEN'}</span>`;if(mode==='select'){h+=`<div class="q">${cur[1]}</div><div class="sub">Welche englische Vokabel gehört dazu?</div><div class="opts" id="opts"></div><div class="note">💡 Erst erkennen. Nach einer richtigen Auswahl steigt das Wort in die nächste Stufe und wird später geschrieben.</div>`}else{h+=`<div class="q">${cur[1]}</div><div class="sub">Schreibe das englische Wort selbst. Deutsch musst du nie schreiben.</div><input class="input" id="in" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Englisches Wort / Phrase"><button class="btn primary" id="check">Prüfen</button>`}h+=`<div id="fb" class="feedback"></div><button class="btn next" id="next">Weiter →</button>`;$('game').innerHTML=h;if(mode==='select'){let opts=sh([cur[0],...sh(V.filter(v=>v[0]!==cur[0])).slice(0,3).map(v=>v[0])]);$('opts').innerHTML=opts.map(x=>`<button class="opt">${x}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.textContent))}else{let i=$('in');$('check').onclick=()=>answer(i.value);i.onkeydown=e=>{if(e.key==='Enter')answer(i.value)};setTimeout(()=>i.focus(),70)}}function answer(ans){if(answered)return;answered=true;let d=P.words[cur[0]],ok=mode==='select'?ans===cur[0]:norm(ans)===norm(cur[0]);if(ok){P.xp+=10;P.streak++;if(P.streak%3===0)P.xp+=10;if(mode==='select'){d.stage=Math.max(d.stage,1);feedback(true,`Richtig! <b>${cur[0]}</b> erkannt. 🎉<br><small>Als Nächstes kommt das Wort zum Schreiben.</small>`)}else{d.writes++;d.wrong=0;if(d.writes>=3)d.stage=3;else d.stage=Math.max(d.stage,2);feedback(true,`Richtig geschrieben! <b>${cur[0]}</b> ✓ ${d.stage>=3?'🌟 SEHR GUT!':'🟢 GUT!'}`+(P.streak%3===0?'<br>🔥 +10 Streak-Bonus!':''))}}else{P.hearts--;P.streak=0;d.wrong++;if(mode==='write')d.stage=Math.max(1,d.stage-1);feedback(false,`Noch nicht. Die richtige Lösung ist <b>${cur[0]}</b>.<br>🧠 ${hint(cur)}`)}P.questions++;save();stats();$('next').classList.add('show');$('next').onclick=next}function feedback(ok,text){let f=$('fb');f.className='feedback show '+(ok?'goodbox':'badbox');f.innerHTML=text}function hint(v){const h={'beautiful':'beautiful klingt wie Beauty – schön.','behind':'behind = hinter.','in front of':'front ist vorne → vor.','next to':'next to = direkt neben.','under':'under = unter.','to bring':'bring = bringen.','to feed':'feed = füttern.','to run around':'run = laufen → herumlaufen.','welcome':'welcome = willkommen.','happy':'happy = glücklich.','car':'car = Auto.','stone':'stone = Stein.','parrot':'parrot = Papagei.','giraffe':'giraffe = Giraffe.'};return h[v[0]]||`${v[0]} = ${v[1]}.`}function next(){if(P.hearts<=0){end();return}if(P.questions%10===0){boss();return}pick()}function boss(){bossPool=V.filter(v=>P.words[v[0]].wrong>0);if(bossPool.length<3)bossPool=sh(V.filter(v=>stage(v)>=1));if(bossPool.length<3)bossPool=V.slice();bossPool=sh(bossPool).slice(0,3);bossIndex=0;cur=bossPool[0];bossQuestion()}function bossQuestion(){answered=false;$('mode').textContent='Boss-Runde';$('round').textContent='Boss '+(bossIndex+1)+'/3';$('game').innerHTML=`<div class="boss"><div class="confetti">✨🎉✨</div><span class="badge">👑 BOSS-RUNDE ${bossIndex+1}/3</span><div class="q">${cur[1]}</div><div class="sub">Schreibe die englische Vokabel!</div><input class="input" id="in" autocomplete="off" autocapitalize="none" spellcheck="false"><button class="btn primary" id="check">Prüfen</button><div id="fb" class="feedback"></div></div>`;let inp=$('in');$('check').onclick=()=>bossAnswer();inp.onkeydown=e=>{if(e.key==='Enter')bossAnswer()};setTimeout(()=>inp.focus(),50)}function bossAnswer(){if(answered)return;answered=true;let d=P.words[cur[0]],ok=norm($('in').value)===norm(cur[0]);if(ok){P.xp+=10;d.writes++;if(d.writes>=3)d.stage=3;else d.stage=Math.max(2,d.stage);feedback(true,'Richtig! 👑')}else{P.hearts--;d.wrong++;d.stage=Math.max(1,d.stage-1);feedback(false,`Die Lösung ist <b>${cur[0]}</b>.`)}save();stats();setTimeout(()=>{if(P.hearts<=0){end();return}bossIndex++;if(bossIndex>=bossPool.length){P.xp+=50;P.bosses++;save();stats();$('game').innerHTML='<div class="boss"><div class="confetti">✨🎉✨</div><h2>Boss besiegt!</h2><p>+50 XP · Badge verdient!</p><button class="btn primary" onclick="pick()">Weiter zur nächsten Quest</button></div>'}else{cur=bossPool[bossIndex];bossQuestion()}},700)}function end(){P.hearts=3;save();stats();$('game').innerHTML=`<div style="text-align:center"><div style="font-size:55px">💪</div><h2>Kurze Pause!</h2><p>Du hast ${mastered()} von ${V.length} Wörtern mindestens bis „GUT“ gelernt.</p><button class="btn primary" onclick="pick()">Mit 3 Herzen weiter</button></div>`}function openOverview(){let c=[0,0,0,0];V.forEach(v=>c[stage(v)]++);$('summary').innerHTML=`<div class="pill">⚪ ${c[0]} NEU</div><div class="pill">🟣 ${c[1]} ÜBEN</div><div class="pill">🟢 ${c[2]} GUT</div><div class="pill">🟡 ${c[3]} SEHR GUT</div><div class="pill">⭐ ${mastered()}/${V.length} gemeistert</div><div class="pill">✍️ ${V.reduce((a,v)=>a+P.words[v[0]].writes,0)} Schreibtreffer</div>`;$('words').innerHTML=V.map(v=>{let l=label(stage(v)),d=P.words[v[0]];return `<div class="word"><div><b>${v[0]}</b><small>${v[1]} · ${d.writes}× richtig geschrieben · ${d.wrong} Fehler</small></div><span class="level ${l[1]}">${l[0]}</span></div>`}).join('');$('modal').classList.add('open')}$('overview').onclick=openOverview;$('close').onclick=()=>$('modal').classList.remove('open');$('resetBtn').onclick=()=>{if(confirm('Lernstand wirklich löschen?')){localStorage.removeItem(KEY);localStorage.removeItem('lotteUnit2ProgressV2');location.reload()}};stats();pick();</script></body></html>
