<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5b5bd6"><title>Miriams English Revision</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef0ff,#f8f8fb);font-family:system-ui,-apple-system,sans-serif;color:#20233a}.app{max-width:720px;margin:auto;padding:14px}.card{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 6px 24px #00000012}h1,h2,h3{margin:0 0 9px}p{line-height:1.45}button{border:0;border-radius:13px;padding:12px 14px;font-weight:800;background:#5b5bd6;color:#fff;cursor:pointer}button:disabled{opacity:.4}.muted{color:#70748a;font-size:13px}.top{display:flex;justify-content:space-between;gap:10px}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.day{background:#eeeef8;color:#20233a;font-size:12px;padding:10px 4px}.day.active{background:#5b5bd6;color:#fff}.day.done{outline:2px solid #1e9d68}.bar{height:9px;background:#e8e8f1;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#5b5bd6;width:0}.q{font-size:27px;font-weight:900;text-align:center;margin:22px 0}.opts{display:grid;gap:9px}.opt{background:#f0f0f8;color:#20233a;text-align:left}.correct{background:#dff6ea!important}.wrong{background:#ffe1e7!important}.feedback{min-height:28px;text-align:center;font-weight:800;margin:10px}input[type=text]{width:100%;padding:13px;border:2px solid #e3e2ed;border-radius:12px;font-size:18px}.primary{width:100%}.smallpill{display:inline-block;background:#eeeef8;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:800}.hide{display:none}.check{display:flex;gap:8px;align-items:center}.check input{width:19px;height:19px}.rule{background:#f5f3ff;border-radius:13px;padding:12px;margin-top:10px}.result{text-align:center;font-size:22px;font-weight:900}@media(max-width:500px){.app{padding:9px}.card{padding:15px}.q{font-size:23px}}</style></head><body><div class="app"><div class="top"><b>📚 Miriam · English Revision</b><span class="muted" id="date"></span></div><div class="card"><h1>Hallo Miriam! 👋</h1><p><b>Schön, dass du da bist!</b> Heute lernst du nur 15 Minuten. Danach bist du für heute fertig.</p><h2 id="welcome"></h2><p id="task"></p><div class="bar"><i id="progress"></i></div><p class="muted" id="progtext"></p><div class="days" id="days"></div></div><div class="card" id="daycard"></div><div class="card" id="work"></div></div><script>
const vocab=[["to give sth. a try","etwas ausprobieren / versuchen"],["to give up","aufgeben"],["audition","Vorsprechen / Casting"],["to have got what it takes","das Zeug dazu haben"],["to make it","es schaffen"],["to be on the way up","auf dem Weg nach oben sein"],["to get back to sb.","sich bei jemandem zurückmelden"],["to agree","zustimmen"],["to belong to","gehören"],["to celebrate","feiern"],["extremely","extrem"],["flute","Flöte"],["singer","Sänger/Sängerin"],["successful","erfolgreich"],["talented","talentiert, begabt"],["to spill","verschütten"],["whole","ganz/e/r/s"],["critic","Kritiker/Kritikerin"],["brave","mutig"],["not even","(noch) nicht einmal"],["suit","Anzug"],["unhappy","unglücklich"],["to waste","verschwenden"],["to feel","(sich) fühlen"],["to get tired of sth.","etw. satt haben"],["lyrics","Liedtext"],["to make up","erfinden, sich ausdenken"],["record","(Schall-)Platte"],["to seem","wirken, scheinen"],["to sing along","mitsingen"],["tune","Melodie"],["I can't stand it.","Ich kann es nicht ausstehen."],["I don't mind.","Ich habe nichts dagegen."],["to come along","mitkommen"],["to take place","stattfinden"],["afterwards","danach, anschließend"],["apart from","abgesehen von"],["in my opinion","meiner Meinung nach"],["to be interested in","an etw. interessiert sein"],["Me neither.","Ich auch nicht."]];
const plans=[{date:"2026-10-03",title:"Samstag · Vokabeln 1",words:[0,10],grammar:"none"},{date:"2026-10-04",title:"Sonntag · Vokabeln 2 + Wiederholung",words:[10,20],grammar:"none"},{date:"2026-10-05",title:"Montag · Vokabeln 3 + Past Simple",words:[20,30],grammar:"past"},{date:"2026-10-06",title:"Dienstag · Vokabeln 4 + Present Perfect",words:[30,40],grammar:"perfect"},{date:"2026-10-07",title:"Mittwoch · Testtag · Mini-Revision",words:[0,40],grammar:"mixed"}];
const past=[["Yesterday I ___ to school.","went",["went","go","gone"]],["She ___ the song last week.","sang",["sang","sing","sung"]],["We ___ the concert yesterday.","saw",["saw","see","seen"]],["He ___ his homework two hours ago.","did",["did","do","done"]],["They ___ to London last year.","went",["went","go","gone"]]];
const perfect=[["I ___ never ___ to London.","have never been",["have never been","went","has never go"]],["She ___ already ___ her homework.","has already finished",["has already finished","have already finish","finished"]],["We ___ this film before.","have seen",["have seen","saw","has see"]],["He ___ just ___ home.","has just come",["has just come","have just came","came"]],["They ___ never ___ sushi.","have never eaten",["have never eaten","has never eat","ate"]]];
const mixed=[["Yesterday she ___ to the audition.","went",["went","has gone","go"]],["She ___ never ___ to an audition.","has never been",["has never been","went","was"]],["We ___ this film before.","have seen",["have seen","saw","see"]],["He ___ to London last year.","went",["went","has gone","go"]],["I ___ just ___ my homework.","have just finished",["have just finished","finished","has finish"]]];
let state={};try{const raw=localStorage.getItem("miriamEnglishRevision202610");state=raw?JSON.parse(raw)||{}:{};}catch(e){state={};}
let current=0,qs=[],qi=0,score=0;
function todayIndex(){const a=new Date("2026-10-03T00:00:00"),b=new Date();const today=new Date(b.getFullYear(),b.getMonth(),b.getDate());return Math.max(0,Math.min(4,Math.floor((today-a)/86400000)))}
function save(){try{localStorage.setItem("miriamEnglishRevision202610",JSON.stringify(state))}catch(e){}}function done(i){return !!state["d"+i]}function selectDay(i){if(i>todayIndex())return;current=i;render()}
function render(){let ti=todayIndex();if(current<ti)current=ti;let d=plans[current],finished=plans.filter((_,i)=>done(i)).length;document.getElementById("date").textContent=new Date().toLocaleDateString("de-AT");document.getElementById("welcome").textContent="Heute ist "+d.date.slice(8,10)+"."+d.date.slice(5,7)+".";document.getElementById("task").textContent="Deine heutige Aufgabe: "+d.title.split(" · ").slice(1).join(" · ");document.getElementById("progress").style.width=(finished/5*100)+"%";document.getElementById("progtext").textContent=finished+" von 5 Tagen erledigt";document.getElementById("days").innerHTML=plans.map((p,i)=>`<button class="day ${i===current?"active ":""}${done(i)?"done ":"}" ${i>ti?"disabled":""} onclick="selectDay(${i})">${p.date.slice(8,10)}.${p.date.slice(5,7)}<br>${done(i)?"✓ fertig":i>ti?"🔒 gesperrt":i===ti?"Heute":"Tag "+(i+1)}</button>`).join("");document.getElementById("daycard").innerHTML=`<span class="smallpill">${current===4?"TESTTAG":"15 MINUTEN"}</span><h2>${d.title}</h2><p>Miriam, heute zählt nur diese kleine Einheit. Du schaffst das!</p><label class="check"><input type="checkbox" ${done(current)?"checked":""} onchange="toggleDone(this.checked)"> <b>${done(current)?"✓ Geschafft! Heute bist du fertig.":"Ich bin für heute fertig."}</b></label>`;startRound()}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startRound(){let d=plans[current],arr=vocab.slice(d.words[0],d.words[1]);if(current===4){qs=shuffle(arr).slice(0,8).map(x=>({type:"v",q:"Was bedeutet „"+x[0]+"“?",correct:x[1],opts:shuffle([x[1],...shuffle(vocab.filter(y=>y!==x)).slice(0,3).map(y=>y[1])])}));qs=qs.concat(shuffle(mixed).slice(0,4).map(x=>({type:"g",q:x[0],correct:x[1],opts:shuffle(x[2])})))}else{qs=shuffle(arr).map(x=>({type:"v",q:"Was bedeutet „"+x[0]+"“?",correct:x[1],opts:shuffle([x[1],...shuffle(vocab.filter(y=>y!==x)).slice(0,3).map(y=>y[1])])})).slice(0,Math.min(8,arr.length));if(d.grammar==="past")qs=qs.concat(shuffle(past).slice(0,4).map(x=>({type:"g",q:x[0],correct:x[1],opts:shuffle(x[2])})));if(d.grammar==="perfect")qs=qs.concat(shuffle(perfect).slice(0,4).map(x=>({type:"g",q:x[0],correct:x[1],opts:shuffle(x[2])})))}qi=0;score=0;showQuestion()}
function showQuestion(){if(qi>=qs.length){finish();return}let x=qs[qi],w=document.getElementById("work"),html=`<span class="smallpill">${current===4?"Mini-Test":"Heute üben"} · ${qi+1}/${qs.length}</span><div class="q">${x.q}</div>`;if(x.type==="v")html+=`<div class="opts">${x.opts.map(o=>`<button class="opt" onclick="answer(this,${JSON.stringify(o)})">${o}</button>`).join("")}</div>`;else html+=`<p class="muted">Schreibe die Lösung selbst:</p><input id="input" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.key==='Enter')checkText()"><button class="primary" style="margin-top:9px" onclick="checkText()">Prüfen</button>`;html+=`<div class="feedback" id="feedback"></div><button class="primary hide" id="next" onclick="qi++;showQuestion()">Weiter</button>`;if(x.type==="g")html+=`<div class="rule"><b>Merke:</b> ${current===2?"Past Simple = 2. Form / -ed":"Present Perfect = have/has + 3. Form"}</div>`;w.innerHTML=html;if(x.type==="g")setTimeout(()=>document.getElementById("input")?.focus(),100)}
function answer(btn,val){let x=qs[qi],ok=val===x.correct;[...document.querySelectorAll(".opt")].forEach(b=>{b.disabled=true;if(b.textContent===x.correct)b.classList.add("correct")});if(!ok)btn.classList.add("wrong");finishQuestion(ok)}function checkText(){let inp=document.getElementById("input"),x=qs[qi],val=inp.value.trim().toLowerCase(),ok=val===x.correct.toLowerCase();inp.disabled=true;finishQuestion(ok)}function finishQuestion(ok){if(ok)score++;let f=document.getElementById("feedback");f.textContent=ok?"Richtig! 🌟":"Noch nicht – richtig wäre: "+qs[qi].correct;f.style.color=ok?"#1e9d68":"#d84c63";document.getElementById("next").classList.remove("hide")}
function finish(){let pct=Math.round(score/qs.length*100);state["d"+current]=true;save();let msg=pct>=80?"Super, Miriam! 🌟":pct>=60?"Gut gemacht, Miriam!":"Gut geübt, Miriam!";document.getElementById("work").innerHTML=`<div class="result">${msg}</div><p style="text-align:center">${score} von ${qs.length} richtig</p><p style="text-align:center">Deine 15 Minuten für heute sind geschafft!</p>`;renderDaysOnly()}
function renderDaysOnly(){let ti=todayIndex(),finished=plans.filter((_,i)=>done(i)).length;document.getElementById("progress").style.width=(finished/5*100)+"%";document.getElementById("progtext").textContent=finished+" von 5 Tagen erledigt";document.getElementById("days").innerHTML=plans.map((p,i)=>`<button class="day ${i===current?"active ":""}${done(i)?"done ":"}" ${i>ti?"disabled":""} onclick="selectDay(${i})">${p.date.slice(8,10)}.${p.date.slice(5,7)}<br>${done(i)?"✓ fertig":i>ti?"🔒 gesperrt":i===ti?"Heute":"Tag "+(i+1)}</button>`).join("")}
function toggleDone(v){state["d"+current]=v;save();render()}render();
</script></body></html>
