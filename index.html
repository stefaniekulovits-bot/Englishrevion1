<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5b5bd6">
<title>Miriams English Revision</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef0ff,#f8f8fb);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#20233a}.app{max-width:760px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}.muted{color:#70748a;font-size:13px}.card{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 6px 24px #00000012}h1,h2,h3{margin:0 0 10px}p{line-height:1.45}.bar{height:9px;background:#e8e8f1;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#5b5bd6;width:0}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:14px}.day{border:0;border-radius:13px;padding:10px 4px;background:#eeeef8;color:#20233a;font-weight:800;cursor:pointer}.day.active{background:#5b5bd6;color:#fff}.day.done{outline:2px solid #1e9d68}.day:disabled{opacity:.45;cursor:not-allowed}.pill{display:inline-block;background:#eeeef8;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:800}.q{font-size:26px;font-weight:900;text-align:center;margin:24px 0}.hint{text-align:center;color:#70748a;margin-top:-12px}.opts{display:grid;gap:9px}.opt{border:0;border-radius:13px;padding:13px 14px;background:#f0f0f8;color:#20233a;text-align:left;font-weight:700;cursor:pointer;font-size:16px}.opt.correct{background:#dff6ea}.opt.wrong{background:#ffe1e7}.feedback{text-align:center;font-weight:800;min-height:28px;margin:12px 0}.primary{width:100%;border:0;border-radius:13px;padding:13px 15px;background:#5b5bd6;color:white;font-weight:800;font-size:16px;cursor:pointer}.primary:disabled{opacity:.45}.hide{display:none}input[type=text]{width:100%;padding:13px;border:2px solid #e3e2ed;border-radius:12px;font-size:18px}.rule{background:#f5f3ff;border-radius:13px;padding:12px;margin-top:12px}.result{text-align:center;font-size:22px;font-weight:900}.error{background:#fff0f2;color:#9d243c;border-radius:13px;padding:12px;display:none;margin-top:12px}.smallgood{background:#e7f8ef;color:#176d49;border-radius:12px;padding:10px;text-align:center;font-weight:700}@media(max-width:520px){.app{padding:9px}.card{padding:15px}.days{grid-template-columns:repeat(3,1fr)}.q{font-size:22px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><b>English Revision · Miriam</b><span class="muted" id="date"></span></div>
  <div class="card">
    <h1>Hallo Miriam!</h1>
    <p><b>Schön, dass du da bist!</b> Du lernst heute nur 15 Minuten.</p>
    <h2 id="todayTitle"></h2>
    <p id="task"></p>
    <div class="bar"><i id="progress"></i></div>
    <p class="muted" id="progtext"></p>
    <div class="days" id="days"></div>
    <div class="error" id="error"></div>
  </div>
  <div class="card" id="daycard"></div>
  <div class="card" id="work"></div>
</div>
<script>
(function(){
'use strict';

// Genau die 40 Wörter/Phrasen vom Word File.
const vocab=[
['to give sth. a try','etwas ausprobieren / versuchen'],['to give up','aufgeben'],['audition','Vorsprechen / Casting'],['to have got what it takes','das Zeug dazu haben'],['to make it','es schaffen'],['to be on the way up','auf dem Weg nach oben sein'],['to get back to sb.','sich bei jemandem zurückmelden'],['to agree','zustimmen'],['to belong to','gehören'],['to celebrate','feiern'],['extremely','extrem'],['flute','Flöte'],['singer','Sänger/Sängerin'],['successful','erfolgreich'],['talented','talentiert, begabt'],['to spill','verschütten'],['whole','ganz/e/r/s'],['critic','Kritiker/Kritikerin'],['brave','mutig'],['not even','(noch) nicht einmal'],['suit','Anzug'],['unhappy','unglücklich'],['to waste','verschwenden'],['to feel','(sich) fühlen'],['to get tired of sth.','etw. satt haben'],['lyrics','Liedtext'],['to make up','erfinden, sich ausdenken'],['record','(Schall-)Platte'],['to seem','wirken, scheinen'],['to sing along','mitsingen'],['tune','Melodie'],["I can't stand it.",'Ich kann es nicht ausstehen.'],["I don't mind.",'Ich habe nichts dagegen.'],['to come along','mitkommen'],['to take place','stattfinden'],['afterwards','danach, anschließend'],['apart from','abgesehen von'],['in my opinion','meiner Meinung nach'],['to be interested in','an etw. interessiert sein'],['Me neither.','Ich auch nicht.']
];

// Pro Tag 8 neue Vokabeln. Jede davon wird zuerst ausgewählt und danach geschrieben.
const plans=[
 {date:'2026-10-03',title:'Samstag · Vokabeln 1',start:0,end:8,grammar:null},
 {date:'2026-10-04',title:'Sonntag · Vokabeln 2',start:8,end:16,grammar:null},
 {date:'2026-10-05',title:'Montag · Vokabeln 3 + Past Simple',start:16,end:24,grammar:'past'},
 {date:'2026-10-06',title:'Dienstag · Vokabeln 4 + Present Perfect',start:24,end:32,grammar:'perfect'},
 {date:'2026-10-07',title:'Mittwoch · Vokabeln 5 + Grammatik',start:32,end:40,grammar:'mixed'}
];

const past=[
 ['Yesterday I ___ to school.','went'],
 ['She ___ the song last week.','sang'],
 ['We ___ the concert yesterday.','saw'],
 ['He ___ his homework two hours ago.','did'],
 ['They ___ to London last year.','went'],
 ['I ___ the film yesterday.','watched']
];
const perfect=[
 ['I ___ never ___ to London.','have never been'],
 ['She ___ already ___ her homework.','has already finished'],
 ['We ___ this film before.','have seen'],
 ['He ___ just ___ home.','has just come'],
 ['They ___ never ___ sushi.','have never eaten'],
 ['I ___ already ___ the song.','have already heard']
];
const mixed=[
 ['Yesterday she ___ to the audition.','went'],
 ['She ___ never ___ to an audition.','has never been'],
 ['We ___ this film before.','have seen'],
 ['He ___ to London last year.','went'],
 ['I ___ just ___ my homework.','have just finished'],
 ['They ___ the concert yesterday.','saw']
];

let state={};
try{state=JSON.parse(localStorage.getItem('miriamEnglishRevision202610')||'{}')||{};}catch(e){state={};}
let current=0,questions=[],questionIndex=0,score=0;
const $=id=>document.getElementById(id);

function todayIndex(){
 const today=new Date();
 const base=new Date(2026,9,3);
 const d=new Date(today.getFullYear(),today.getMonth(),today.getDate());
 const n=Math.floor((d-base)/86400000);
 return Math.max(0,Math.min(plans.length-1,n));
}
function shuffle(arr){return arr.slice().sort(()=>Math.random()-0.5)}
function save(){try{localStorage.setItem('miriamEnglishRevision202610',JSON.stringify(state));}catch(e){}}
function isDone(i){return state['day'+i]===true}

function render(){
 const ti=todayIndex();
 if(current>ti) current=ti;
 const p=plans[current];
 const finished=plans.filter((_,i)=>isDone(i)).length;
 $('date').textContent=new Date().toLocaleDateString('de-AT');
 $('todayTitle').textContent=p.title;
 $('task').textContent=current===4?'Heute übst du deine letzten 8 Vokabeln und wiederholst die Grammatik.':'Klicke auf deinen Lerntag. Zuerst wählst du die englische Vokabel aus, danach schreibst du sie selbst.';
 $('progress').style.width=(finished/plans.length*100)+'%';
 $('progtext').textContent=finished+' von '+plans.length+' Tagen erledigt';
 $('days').innerHTML='';
 plans.forEach((x,i)=>{
   const b=document.createElement('button');
   b.className='day'+(i===current?' active':'')+(isDone(i)?' done':'');
   b.disabled=i>ti;
   b.innerHTML=x.date.slice(8,10)+'.'+x.date.slice(5,7)+'<br>'+(isDone(i)?'✓ fertig':i>ti?'gesperrt':i===ti?'Heute':'Tag '+(i+1));
   b.addEventListener('click',()=>{current=i;render();});
   $('days').appendChild(b);
 });
 $('daycard').innerHTML='<span class="pill">15 MINUTEN</span><h2>'+p.title+'</h2><p>Miriam, heute übst du <b>8 Vokabeln</b>.</p><p class="muted">Ablauf: <b>1. auswählen</b> → <b>2. Englisch schreiben</b>'+(p.grammar?' → <b>3. Grammatik schreiben</b>':'')+'</p>';
 startRound();
}

function vocabQuestions(start,end){
 return vocab.slice(start,end).map(x=>({
   type:'vselect',
   german:x[1],
   correct:x[0],
   opts:shuffle([x[0]].concat(shuffle(vocab.filter(y=>y[0]!==x[0])).slice(0,3).map(y=>y[0])))
 })).concat(vocab.slice(start,end).map(x=>({type:'vwrite',german:x[1],correct:x[0]})));
}
function grammarQuestions(kind,count){
 let src=kind==='past'?past:kind==='perfect'?perfect:mixed;
 return shuffle(src).slice(0,count).map(x=>({type:'g',q:x[0],correct:x[1]}));
}
function startRound(){
 const p=plans[current];
 questions=vocabQuestions(p.start,p.end);
 if(p.grammar) questions=questions.concat(grammarQuestions(p.grammar,4));
 questionIndex=0;score=0;showQuestion();
}

function showQuestion(){
 if(questionIndex>=questions.length){finishRound();return;}
 const x=questions[questionIndex];
 let label=x.type==='vselect'?'Vokabeln · auswählen':x.type==='vwrite'?'Vokabeln · schreiben':'Grammatik · schreiben';
 let html='<span class="pill">'+label+' · '+(questionIndex+1)+'/'+questions.length+'</span>';
 if(x.type==='vselect'){
   html+='<div class="q">'+x.german+'</div><div class="hint">Wähle die richtige englische Vokabel.</div><div class="opts" id="opts"></div>';
 }else if(x.type==='vwrite'){
   html+='<div class="q">'+x.german+'</div><div class="hint">Schreibe die englische Vokabel selbst.</div><input id="answerInput" type="text" autocomplete="off" spellcheck="false" placeholder="English word / phrase"><button class="primary" id="checkBtn" style="margin-top:9px">Prüfen</button>';
 }else{
   html+='<div class="q">'+x.q+'</div><div class="hint">Schreibe die fehlende englische Form selbst.</div><input id="answerInput" type="text" autocomplete="off" spellcheck="false" placeholder="English"><button class="primary" id="checkBtn" style="margin-top:9px">Prüfen</button>';
 }
 html+='<div class="feedback" id="feedback"></div><button class="primary hide" id="nextBtn">Weiter</button>';
 if(x.type==='g') html+='<div class="rule"><b>Merke:</b> '+(x.q.includes('Yesterday')||x.q.includes('last')||x.q.includes('ago')?'Past Simple: 2. Form / -ed':'Present Perfect: have/has + 3. Form')+'</div>';
 $('work').innerHTML=html;
 if(x.type==='vselect'){
   const opts=$('opts');
   x.opts.forEach(o=>{
     const b=document.createElement('button');b.className='opt';b.textContent=o;
     b.addEventListener('click',()=>answerSelect(b,o));opts.appendChild(b);
   });
 }else{
   $('checkBtn').addEventListener('click',checkWritten);
   $('answerInput').addEventListener('keydown',e=>{if(e.key==='Enter')checkWritten();});
   setTimeout(()=>$('answerInput')?.focus(),80);
 }
}
function normalize(s){return s.trim().toLowerCase().replace(/[’']/g,"'").replace(/\s+/g,' ')}
function finishQuestion(ok){
 if(ok)score++;
 const f=$('feedback');f.textContent=ok?'Richtig!':'Noch nicht – richtig wäre: '+questions[questionIndex].correct;f.style.color=ok?'#1e9d68':'#d84c63';
 $('nextBtn').classList.remove('hide');$('nextBtn').addEventListener('click',()=>{questionIndex++;showQuestion();},{once:true});
}
function answerSelect(btn,val){
 const x=questions[questionIndex];
 document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent===x.correct)b.classList.add('correct');});
 const ok=val===x.correct;if(!ok)btn.classList.add('wrong');finishQuestion(ok);
}
function checkWritten(){
 const x=questions[questionIndex];const input=$('answerInput');const val=normalize(input.value);const ok=val===normalize(x.correct);
 input.disabled=true;$('checkBtn').disabled=true;finishQuestion(ok);
}
function finishRound(){
 state['day'+current]=true;save();
 const pct=Math.round(score/questions.length*100);
 $('work').innerHTML='<div class="result">'+(pct>=80?'Super, Miriam!':pct>=60?'Gut gemacht, Miriam!':'Gut geübt, Miriam!')+'</div><p style="text-align:center">'+score+' von '+questions.length+' richtig</p><div class="smallgood">✓ Heute fertig! Du hast deine 15 Minuten geschafft.</div><p class="muted" style="text-align:center">Morgen wartet die nächste kleine Einheit auf dich.</p>';
 renderProgress();
}
function renderProgress(){
 const finished=plans.filter((_,i)=>isDone(i)).length;$('progress').style.width=(finished/plans.length*100)+'%';$('progtext').textContent=finished+' von '+plans.length+' Tagen erledigt';
 document.querySelectorAll('.day').forEach((b,i)=>{b.classList.toggle('done',isDone(i));if(isDone(i))b.innerHTML=plans[i].date.slice(8,10)+'.'+plans[i].date.slice(5,7)+'<br>✓ fertig';});
}

try{render();}catch(e){$('error').style.display='block';$('error').textContent='Das Spiel konnte nicht gestartet werden. Fehler: '+e.message;console.error(e);}
})();
</script>
</body>
</html>
