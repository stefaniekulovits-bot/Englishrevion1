<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15132d"><title>Lottes Anime Vokabel Quest</title><style>*{box-sizing:border-box}body{margin:0;background:#100e24;color:#f8f7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;overflow-x:hidden}.app{max-width:720px;margin:auto;padding:14px 12px 28px;position:relative}.bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 15% 10%,#5b4bc4 0,#211c50 30%,#100e24 70%)}.stars{position:fixed;inset:0;z-index:-1;opacity:.55;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(#000,transparent)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.topActions{display:flex;align-items:center;gap:7px}.smallBtn{border:1px solid #ffffff22;background:#ffffff10;color:#fff;border-radius:13px;padding:8px 10px;font-weight:900;font-size:12px;cursor:pointer}.brand{font-weight:950;font-size:20px;letter-spacing:-.5px}.brand span{color:#8ee8ff}.level{padding:8px 12px;border:1px solid #ffffff20;background:#ffffff12;border-radius:99px;font-weight:900;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.stat{background:#ffffff0d;border:1px solid #ffffff18;border-radius:15px;padding:8px 4px;text-align:center;backdrop-filter:blur(10px)}.lab{font-size:9px;color:#bdb9d8;font-weight:900;text-transform:uppercase}.val{font-weight:950;font-size:15px;margin-top:2px}.card{background:#ffffff0e;border:1px solid #ffffff1c;border-radius:24px;padding:15px;margin-top:11px;box-shadow:0 16px 45px #0005;backdrop-filter:blur(14px)}.hero{display:grid;grid-template-columns:145px 1fr;gap:12px;align-items:center}.mascot{min-height:165px;border-radius:22px;background:linear-gradient(145deg,#2b225b,#17152f);display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid #ffffff18}.mascot svg{width:145px;height:165px}.speech{font-size:15px;font-weight:800;line-height:1.35}.speech small{display:block;color:#bdb9d8;font-weight:700;margin-top:6px}.badge{display:inline-flex;padding:6px 9px;border-radius:99px;background:#8ee8ff1a;color:#8ee8ff;font-size:10px;font-weight:950;letter-spacing:.5px}.prog{display:flex;justify-content:space-between;color:#bdb9d8;font-size:12px;font-weight:850}.bar{height:9px;background:#ffffff10;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;width:0;background:linear-gradient(90deg,#8ee8ff,#9d7cff,#ff77bb);transition:.35s}.q{text-align:center;font-size:29px;font-weight:950;margin:17px 0 5px}.sub{text-align:center;color:#bdb9d8;font-size:13px;margin-bottom:14px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn,.opt{border:0;border-radius:17px;padding:14px;background:#ffffff0c;color:#fff;border:1px solid #ffffff17;font-weight:900;font-size:16px;cursor:pointer;transition:.15s}.opt{min-height:64px}.opt:hover{transform:translateY(-1px);background:#ffffff16}.opt.good{background:#174f49;border-color:#5df0cb}.opt.bad{background:#54233d;border-color:#ff7ba8}.input{width:100%;padding:16px;border:2px solid #ffffff22;background:#0e0c20;color:#fff;border-radius:17px;font-size:20px;font-weight:850;outline:0;text-align:center}.input:focus{border-color:#8ee8ff;box-shadow:0 0 0 4px #8ee8ff18}.primary{width:100%;margin-top:9px;background:linear-gradient(90deg,#6f5cff,#a14dff);border:0}.feedback{min-height:48px;margin-top:11px;padding:11px;border-radius:15px;font-size:14px;display:none}.feedback.show{display:block}.goodbox{background:#123c37;color:#9fffe8}.badbox{background:#431d32;color:#ffd0df}.next{display:none;width:100%;margin-top:9px;background:#fff;color:#18142e}.next.show{display:block}.mini{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{font-size:11px;font-weight:850;padding:6px 8px;border-radius:99px;background:#ffffff0c;color:#cbc7e3}.chip strong{color:#fff}.shake{animation:shake .32s}@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-3px)}}.pop{animation:pop .35s}@keyframes pop{0%{transform:scale(.94)}70%{transform:scale(1.03)}100%{transform:scale(1)}}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;width:8px;height:14px;border-radius:2px;animation:fall 1.4s linear forwards}@keyframes fall{from{transform:translateY(-20px) rotate(0)}to{transform:translateY(105vh) rotate(700deg)}}.hidden{display:none!important}.overview{position:fixed;inset:0;background:#100e24ee;backdrop-filter:blur(12px);z-index:20;overflow:auto;padding:18px 12px}.overviewCard{max-width:720px;margin:0 auto;background:#191633;border:1px solid #ffffff20;border-radius:24px;padding:16px;box-shadow:0 20px 70px #0009}.overviewHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.overviewHead h2{margin:0;font-size:22px}.legend{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.legend span{padding:6px 9px;border-radius:99px;font-size:11px;font-weight:900}.new{background:#ffffff10;color:#cbc7e3}.learning{background:#3d2e72;color:#cfc3ff}.good{background:#123c37;color:#9fffe8}.mastered{background:#5a3d16;color:#ffe18a}.wordList{display:grid;gap:8px;margin-top:12px}.wordRow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 11px;border:1px solid #ffffff14;background:#ffffff08;border-radius:14px}.wordMain{font-weight:900}.wordMain small{display:block;color:#aaa5c5;font-weight:700;margin-top:2px}.status{font-size:10px;font-weight:950;padding:6px 8px;border-radius:99px}.status.new{background:#ffffff10;color:#cbc7e3}.status.learning{background:#3d2e72;color:#cfc3ff}.status.good{background:#123c37;color:#9fffe8}.status.mastered{background:#5a3d16;color:#ffe18a}@media(max-width:540px){.hero{grid-template-columns:115px 1fr}.mascot{min-height:145px}.mascot svg{width:120px;height:145px}.q{font-size:25px}.opts{grid-template-columns:1fr}.stats .stat{padding:7px 2px}.val{font-size:13px}}
</style></head><body><div class="bg"></div><div class="stars"></div><div class="confetti" id="confetti"></div><main class="app"><div class="top"><div class="brand">Lottes <span>Anime Quest</span> ✦</div><div class="topActions"><button class="smallBtn" onclick="showOverview()">📚 Übersicht</button><div class="level" id="level">Level 1</div></div></div><div class="stats"><div class="stat"><div class="lab">Herzen</div><div class="val" id="hearts">❤️❤️❤️</div></div><div class="stat"><div class="lab">XP</div><div class="val" id="xp">0</div></div><div class="stat"><div class="lab">Streak</div><div class="val" id="streak">0</div></div><div class="stat"><div class="lab">Gelernt</div><div class="val" id="learned">0/46</div></div></div><div class="card hero"><div class="mascot" id="mascot"></div><div><span class="badge" id="modeBadge">TRAINING ARC</span><div class="speech" id="speech">Wähle zuerst die richtige englische Vokabel aus. Wenn du sie kannst, musst du sie später selbst schreiben!<small id="speechSmall">Noch 46 Wörter zu meistern.</small></div></div></div><div class="card"><div class="prog"><span id="mode">Vokabeln kennenlernen</span><span id="round">1/46</span></div><div class="bar"><div class="fill" id="fill"></div></div></div><div class="card" id="game"></div></main><div class="overview hidden" id="overview"><div class="overviewCard"><div class="overviewHead"><h2>📚 Meine Vokabeln</h2><button class="smallBtn" onclick="hideOverview()">✕ Schließen</button></div><div class="legend"><span class="new">NEU</span><span class="learning">NOCH ÜBEN</span><span class="good">GUT</span><span class="mastered">SEHR GUT</span></div><div id="overviewSummary" class="speech" style="margin-top:10px"></div><div class="wordList" id="wordList"></div></div></div><script>
const V=[['tree','Baum'],['monkey','Affe'],['parrot','Papagei'],['giraffe','Giraffe'],['train','Zug'],['penguin','Pinguin'],['guide','Reiseführer/in'],['lion','Löwe'],['next to','neben'],['in','in'],['behind','hinter'],['under','unter'],['on','auf'],['in front of','vor'],['zoo','Zoo'],['beautiful','schön / hübsch'],['big','groß'],['now','jetzt'],["there is (there's)",'es gibt / da ist'],['there are','es gibt / da sind'],['What is it?','Was ist los?'],['where','wo'],['small','klein'],['adult','Erwachsene/r'],['at','bei; an; hier: in'],['to bring','(mit-)bringen'],['but','aber'],['to feed','füttern'],['guide','Reiseführer/in'],['to run around','herumlaufen'],['train','Zug'],['to','zu; bis; vor; hier: in'],['welcome','willkommen'],['from','aus'],['year','Jahr; Jahrgangsstufe'],['he','er'],['she','sie'],['to talk','sprechen; sich unterhalten'],['they','sie'],['we','wir'],['for','für'],['happy','glücklich; fröhlich; zufrieden'],['to let somebody out','jemanden herauslassen'],['us','uns'],['car','Auto'],['At last','Endlich'],['How strange!','Wie komisch!'],['Let me see.','Lass mich mal schauen.'],['stone','Stein']];const U=[...new Map(V.map(x=>[x[0],x])).values()];const TOTAL=U.length;const key='lotteAnimeQuestV2';let saved=JSON.parse(localStorage.getItem(key)||'null');let S=saved||{h:3,xp:0,st:0,learned:[],wrong:[],q:0,boss:false,bi:0,bw:[],skills:{}};if(!S.skills||typeof S.skills!=='object')S.skills={};U.forEach(x=>{if(!S.skills[x[0]])S.skills[x[0]]={correct:0,wrong:0,writes:0,writeStreak:0};if(S.skills[x[0]].writeStreak===undefined)S.skills[x[0]].writeStreak=0});if(!Array.isArray(S.learned))S.learned=[];if(!Array.isArray(S.wrong))S.wrong=[];let cur=null,answered=false,type='mc';const $=x=>document.getElementById(x);const norm=x=>x.trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');const sh=a=>a.slice().sort(()=>Math.random()-.5);function save(){localStorage.setItem(key,JSON.stringify(S))}function skill(id){return S.skills[id]||(S.skills[id]={correct:0,wrong:0,writes:0,writeStreak:0})}function statusFor(id){let k=skill(id);if(!S.learned.includes(id))return ['new','NEU'];if(k.writeStreak>=3)return ['mastered','SEHR GUT'];if(k.writes>=1)return ['good','GUT'];return ['learning','NOCH ÜBEN']}function showOverview(){let learned=U.filter(x=>S.learned.includes(x[0])).length;let good=U.filter(x=>['good','mastered'].includes(statusFor(x[0])[0])).length;let mastered=U.filter(x=>statusFor(x[0])[0]==='mastered').length;$('overviewSummary').innerHTML=`<b>${learned}/${TOTAL}</b> kennst du bereits · <b>${good}</b> kannst du gut · <b>${mastered}</b> sitzen richtig sicher.`;$('wordList').innerHTML=U.map(x=>{let k=skill(x[0]),st=statusFor(x[0]);return `<div class="wordRow"><div class="wordMain">${x[1]}<small>${x[0]} · geschrieben: ${k.writes}× · Fehler: ${k.wrong}×</small></div><span class="status ${st[0]}">${st[1]}</span></div>`}).join('');$('overview').classList.remove('hidden')}function hideOverview(){$('overview').classList.add('hidden')}function mascot(face='normal'){let eyes=face==='happy'?'^ ^':face==='sad'?'x x':'• •';$('mascot').innerHTML=`<svg viewBox="0 0 160 190" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="h" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9d7cff"/><stop offset="1" stop-color="#4c9dff"/></linearGradient></defs><circle cx="80" cy="91" r="62" fill="#ffd7c2"/><path d="M27 76Q18 19 57 36Q80 11 106 34Q145 15 132 78L115 55Q93 73 48 57Z" fill="url(#h)"/><path d="M28 78Q7 62 25 47Q38 55 43 76M132 78Q153 62 135 47Q122 55 117 76" fill="#6d57c9"/><ellipse cx="57" cy="95" rx="9" ry="13" fill="#19152e"/><ellipse cx="103" cy="95" rx="9" ry="13" fill="#19152e"/><circle cx="60" cy="91" r="3" fill="#fff"/><circle cx="106" cy="91" r="3" fill="#fff"/><path d="M73 120Q80 ${face==='happy'?134:face==='sad'?116:127} 87 120" fill="none" stroke="#8e3d5e" stroke-width="4" stroke-linecap="round"/><path d="M47 148Q80 132 113 148L122 190H38Z" fill="#20204b"/><path d="M80 143l10 12-10 11-10-11z" fill="#8ee8ff"/><circle cx="80" cy="157" r="4" fill="#fff"/><text x="80" y="181" text-anchor="middle" fill="#bdb9d8" font-size="10" font-weight="800">QUEST HERO</text></svg>`}function renderStats(){$('hearts').textContent='❤️'.repeat(Math.max(0,S.h))+'🖤'.repeat(Math.max(0,3-S.h));$('xp').textContent=S.xp;$('streak').textContent=S.st;$('learned').textContent=S.learned.length+'/'+TOTAL;let pct=S.learned.length/TOTAL*100;$('fill').style.width=pct+'%';$('level').textContent=S.learned.length<TOTAL/2?'Level 1':S.learned.length<TOTAL?'Level 2':'Level 3';$('speechSmall').textContent=S.learned.length===TOTAL?'Alle Wörter gelernt – jetzt gemischt üben!':`Noch ${TOTAL-S.learned.length} Wörter kennenlernen.`}function choose(){let un=U.filter(x=>!S.learned.includes(x[0]));if(un.length){let pool=S.wrong.length?sh(un.filter(x=>S.wrong.includes(x[0]))).concat(sh(un.filter(x=>!S.wrong.includes(x[0])))):sh(un);return pool[0]}let pool=U.filter(x=>S.wrong.includes(x[0]));return sh(pool.length?pool:U)[0]}function ask(){if(S.h<=0)return gameOver();cur=choose();answered=false;type=S.learned.includes(cur[0])?(S.learned.length===TOTAL&&!S.wrong.includes(cur[0])&&Math.random()<0.25?'mc':'write'):'mc';$('mode').textContent=type==='write'?'Schreibmodus · bereits gelernt':'Lernmodus · richtig auswählen';$('round').textContent=type==='write'?'Schreiben':`${S.learned.length+1}/${TOTAL}`;$('modeBadge').textContent=type==='write'?'✍️ WRITING ARC':'🎯 TRAINING ARC';mascot('normal');let html=`<span class="badge">${type==='write'?'ENGLISCH SELBST SCHREIBEN':'ENGLISCH AUSWÄHLEN'}</span>`;if(type==='write'){html+=`<div class="q">${cur[1]}</div><div class="sub">Dieses Wort hast du schon gelernt. Jetzt beweis es!</div><input class="input" id="in" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Englische Vokabel"><button class="btn primary" id="check">Prüfen</button>`}else{html+=`<div class="q">${cur[1]}</div><div class="sub">Welche englische Vokabel bedeutet das?</div><div class="opts" id="opts"></div>`}html+=`<div id="fb" class="feedback"></div><button class="btn next" id="next">Weiter →</button>`;$('game').innerHTML=html;if(type==='write'){let i=$('in');$('check').onclick=()=>check(i.value);i.onkeydown=e=>{if(e.key==='Enter')check(i.value)};setTimeout(()=>i.focus(),60)}else{let choices=sh([cur[0],...sh(U.filter(x=>x[0]!==cur[0])).slice(0,3).map(x=>x[0])]);$('opts').innerHTML=choices.map(x=>`<button class="opt">${x}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>check(b.textContent))}}function check(ans){if(answered)return;answered=true;let ok=norm(ans)===norm(cur[0]);if(ok){let k=skill(cur[0]);k.correct++;if(type==='write'){k.writes++;k.writeStreak=(k.writeStreak||0)+1}else{k.writeStreak=k.writeStreak||0}S.xp+=10;S.st++;let bonus=S.st%3===0;if(bonus)S.xp+=10;if(!S.learned.includes(cur[0])){S.learned.push(cur[0]);S.wrong=S.wrong.filter(x=>x!==cur[0])}else S.wrong=S.wrong.filter(x=>x!==cur[0]);save();mascot('happy');$('game').classList.add('pop');setTimeout(()=>$('game').classList.remove('pop'),350);fb(true,`Richtig! <b>${cur[0]}</b> ✓${bonus?' · 🔥 +10 Streak-Bonus':''}`)}else{let k=skill(cur[0]);k.wrong++;k.writeStreak=0;S.h--;S.st=0;if(!S.wrong.includes(cur[0]))S.wrong.push(cur[0]);save();mascot('sad');$('game').classList.add('shake');setTimeout(()=>$('game').classList.remove('shake'),350);fb(false,`Noch nicht. Richtig ist <b>${cur[0]}</b>.<br>🧠 ${hint(cur)}`)}renderStats();$('next').classList.add('show');$('next').textContent=S.h<=0?'Ergebnis ansehen →':'Weiter →';$('next').onclick=()=>{if(S.h<=0)gameOver();else{if(S.learned.length===TOTAL&&startBossIfReady())return;ask()}}}function fb(g,t){let f=$('fb');f.className='feedback show '+(g?'goodbox':'badbox');f.innerHTML=t}function hint(w){let m={'beautiful':'beautiful klingt wie Beauty → schön.','behind':'behind = hinter.','in front of':'front ist vorne → vor.','next to':'next to = direkt neben.','under':'under = unter.','to bring':'bring = bringen.','to feed':'feed = füttern.','to run around':'run = laufen → herumlaufen.','welcome':'welcome = willkommen.','happy':'happy = glücklich.','car':'car = Auto.','stone':'stone = Stein.'};return m[w[0]]||`Merke: <b>${w[0]}</b> = ${w[1]}.`}function startBossIfReady(){if(S.boss)return true;if(S.learned.length===TOTAL){S.boss=true;S.bi=0;S.bw=sh(S.wrong.map(id=>U.find(x=>x[0]===id)).filter(Boolean));if(S.bw.length<3)S.bw=sh(U).slice(0,3);boss();return true}return false}function boss(){if(S.bi>=3){win();return}cur=S.bw[S.bi];answered=false;type='write';$('modeBadge').textContent='👑 BOSS ARC';$('mode').textContent='Boss-Runde · nur schreiben';$('round').textContent=`Boss ${S.bi+1}/3`;$('fill').style.width='100%';$('speech').textContent='Boss-Runde! Diese 3 Wörter musst du ohne Hilfe schreiben.';mascot('normal');$('game').innerHTML=`<span class="badge">👑 BOSS · ENGLISCH SCHREIBEN</span><div class="q">${cur[1]}</div><div class="sub">Schreibe die englische Vokabel.</div><input class="input" id="in" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Englische Vokabel"><button class="btn primary" id="check">Prüfen</button><div id="fb" class="feedback"></div><button class="btn next" id="next">Weiter →</button>`;let i=$('in');$('check').onclick=()=>bossCheck(i.value);i.onkeydown=e=>{if(e.key==='Enter')bossCheck(i.value)};setTimeout(()=>i.focus(),60)}function bossCheck(ans){if(answered)return;answered=true;let ok=norm(ans)===norm(cur[0]);if(ok){let k=skill(cur[0]);k.correct++;k.writes++;k.writeStreak=(k.writeStreak||0)+1;S.xp+=15;mascot('happy');fb(true,`Boss-Treffer! <b>${cur[0]}</b> ✓`)}else{let k=skill(cur[0]);k.wrong++;k.writeStreak=0;S.h--;S.st=0;fb(false,`Boss-Wort: <b>${cur[0]}</b><br>🧠 ${hint(cur)}`);mascot('sad')}save();renderStats();$('next').classList.add('show');$('next').onclick=()=>{if(S.h<=0)return gameOver();S.bi++;boss()}}function win(){S.xp+=50;save();confetti();$('speech').textContent='Du hast die Boss-Runde geschafft! Das war richtig stark!';mascot('happy');$('game').innerHTML=`<div style="text-align:center"><div style="font-size:64px">👑✨</div><span class="badge">ABZEICHEN FREIGESCHALTET</span><h2>Anime-Vokabelmeisterin!</h2><p>Alle Wörter gelernt und die Boss-Runde bestanden.</p><p><b>+50 XP</b> · Gesamt: <b>${S.xp} XP</b></p><button class="btn primary" onclick="resetGame()">Nochmal trainieren</button></div>`}function gameOver(){$('game').innerHTML=`<div style="text-align:center"><div style="font-size:58px">💫</div><span class="badge">TRAINING PAUSE</span><h2>Neue Runde?</h2><p>Du hast <b>${S.learned.length}/${TOTAL}</b> Wörter gelernt und <b>${S.xp}</b> XP gesammelt.</p><button class="btn primary" onclick="resetHearts()">Mit 3 Herzen weitermachen</button></div>`;renderStats()}function resetHearts(){S.h=3;S.st=0;save();renderStats();ask()}function resetGame(){localStorage.removeItem(key);location.reload()}function confetti(){for(let i=0;i<70;i++){let e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.top=(-Math.random()*20)+'%';e.style.background=['#8ee8ff','#ff77bb','#9d7cff','#ffe36e'][i%4];e.style.animationDelay=Math.random()*.6+'s';$('confetti').appendChild(e);setTimeout(()=>e.remove(),1700)}}renderStats();ask();</script></body></html>
